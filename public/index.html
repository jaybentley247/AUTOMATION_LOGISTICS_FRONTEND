<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="AUTOMATION LOGISTICS — road, ocean, air and rail freight with real-time shipment tracking."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />
    <script>
      // Apply a saved Light/Dark choice before first paint (System is the default).
      (function () {
        try {
          var t = localStorage.getItem("automationLogisticsTheme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <title>AUTOMATION LOGISTICS</title>
    <style>
      /* Startup loader. Inline so it shows before the app's CSS/JS arrive. */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        background: #f7f7f5;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #app-loader { background: #0b0c0e; }
      }
      :root[data-theme="dark"] #app-loader { background: #0b0c0e; }
      #app-loader.is-done { opacity: 0; visibility: hidden; }
      .app-loader-inner { display: grid; justify-items: center; gap: 28px; }
      .app-loader-logo { animation: app-loader-pulse 1.4s ease-in-out infinite; }
      .app-loader-logo img { display: block; height: 52px; width: auto; }
      /* Dark lettering on light, white lettering on dark. */
      .app-loader-logo .on-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .app-loader-logo .on-light { display: none; }
        :root:not([data-theme="light"]) .app-loader-logo .on-dark { display: block; }
      }
      :root[data-theme="dark"] .app-loader-logo .on-light { display: none; }
      :root[data-theme="dark"] .app-loader-logo .on-dark { display: block; }
      .app-loader-bar {
        width: 180px;
        height: 4px;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(127, 127, 127, 0.25);
      }
      .app-loader-bar span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 4px;
        background: #dc2626;
        animation: app-loader-fill 2s ease-out forwards;
      }
      @keyframes app-loader-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes app-loader-fill { to { width: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        .app-loader-logo, .app-loader-bar span { animation: none; }
        .app-loader-bar span { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" role="status" aria-label="Loading AUTOMATION LOGISTICS">
      <div class="app-loader-inner">
        <div class="app-loader-logo">
          <img class="on-light" src="%PUBLIC_URL%/logo.svg" alt="AUTOMATION LOGISTICS" />
          <img class="on-dark" src="%PUBLIC_URL%/logo-dark.svg" alt="" aria-hidden="true" />
        </div>
        <div class="app-loader-bar"><span></span></div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
